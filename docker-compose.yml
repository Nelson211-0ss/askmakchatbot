services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: askmak
      POSTGRES_PASSWORD: askmak_dev
      POSTGRES_DB: askmak
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/admin_schema.sql:/docker-entrypoint-initdb.d/02-admin_schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmak -d askmak"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "5434:6432"
    environment:
      DATABASE_URL: postgresql://askmak:askmak_dev@db:5432/askmak
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 250
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 100
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: askmak_minio
      MINIO_ROOT_PASSWORD: askmak_minio_secret
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
