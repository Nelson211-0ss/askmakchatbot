# VPS / Dockeruser policy stack (external network, ~/docker-volumes).
#
# Host ports (keep in 4000–4999 to avoid clashes with other stacks):
#   4500  app HTTP (127.0.0.1 — nginx proxies here)
#   4520  Postgres
#   4530  Redis
#   4900  MinIO API
#   4901  MinIO console
#
# Prerequisites:
#   docker network create dockeruser_network
#   mkdir -p "${HOME}/docker-volumes/askmak/pgdata" "${HOME}/docker-volumes/askmak/minio" "${HOME}/docker-volumes/askmak/redis"
# Copy `.env` (JWT, OpenAI keys, TRUST_PROXY, CORS_ORIGIN, etc.).
# Compose overrides DATABASE_URL and MINIO_ENDPOINT for the app container (@db:5432, http://minio:9000).
#
# Run: docker compose -f docker-compose.dockeruser.yml up -d --build
# Buckets (first deploy / empty MinIO): docker compose -f docker-compose.dockeruser.yml run --rm app npm run setup-minio

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:4521:5432"
    environment:
      POSTGRES_USER: askmak
      POSTGRES_PASSWORD: askmak_dev
      POSTGRES_DB: askmak
    volumes:
      - ${HOME}/docker-volumes/askmak/pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/admin_schema.sql:/docker-entrypoint-initdb.d/02-admin_schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    networks:
      - dockeruser_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmak -d askmak"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4520:6432"
    environment:
      DATABASE_URL: postgresql://askmak:askmak_dev@db:5432/askmak
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 250
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 100
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dockeruser_network

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:4900:9000"
      - "127.0.0.1:4901:9001"
    environment:
      MINIO_ROOT_USER: askmak_minio
      MINIO_ROOT_PASSWORD: askmak_minio_secret
    volumes:
      - ${HOME}/docker-volumes/askmak/minio:/data
    networks:
      - dockeruser_network

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4530:6379"
    volumes:
      - ${HOME}/docker-volumes/askmak/redis:/data
    networks:
      - dockeruser_network

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4500:4500"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "4500"
      NODE_ENV: production
      DATABASE_URL: postgresql://askmak:askmak_dev@pgbouncer:6432/askmak
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
    depends_on:
      pgbouncer:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - dockeruser_network

networks:
  dockeruser_network:
    external: true
