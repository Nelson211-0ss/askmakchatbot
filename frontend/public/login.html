<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In - AskMak</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#00a651">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var k = localStorage.getItem('askmak-theme');
        var dark =
          k === 'dark'
            ? true
            : k === 'light'
              ? false
              : typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', !!dark);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page relative font-sans bg-transparent text-gray-900 dark:bg-chat-canvas dark:text-zinc-100 min-h-dvh flex flex-col pb-[env(safe-area-inset-bottom,0px)]">

  <div class="home-chatbot-bg" aria-hidden="true">
    <div class="home-chatbot-bg__mesh"></div>
    <div class="home-chatbot-bg__grid"></div>
    <div class="home-chatbot-bg__orb home-chatbot-bg__orb--1"></div>
    <div class="home-chatbot-bg__orb home-chatbot-bg__orb--2"></div>
  </div>

  <header class="relative z-10 shrink-0 pt-[max(0px,env(safe-area-inset-top,0px))]">
    <div class="max-w-md mx-auto w-full pl-[max(1rem,env(safe-area-inset-left,0px))] pr-[max(1rem,env(safe-area-inset-right,0px))] sm:px-5 pt-3 sm:pt-4 pb-1 flex items-center justify-between gap-3">
      <a href="/" class="group inline-flex items-center gap-2 rounded-lg pl-1.5 pr-2.5 py-2 text-sm font-medium text-gray-600 hover:text-mak-dark dark:text-zinc-400 dark:hover:text-white transition">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-white/90 text-gray-500 shadow-sm ring-1 ring-gray-200/80 group-hover:text-mak-green group-hover:ring-mak-green/30 dark:bg-chat-raised dark:text-zinc-500 dark:ring-chat-line/50 dark:group-hover:text-mak-green transition">
          <i data-feather="arrow-left" width="18" height="18"></i>
        </span>
        <span>Home</span>
      </a>
      <span class="hidden sm:inline text-xs text-gray-400 dark:text-zinc-500 font-medium tracking-wide uppercase">Secure sign in</span>
    </div>
  </header>

  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-3 sm:py-5 pb-[max(1rem,env(safe-area-inset-bottom,0px))]">
    <div class="w-full max-w-[17.75rem] sm:max-w-[18.25rem] animate-fade-in motion-reduce:animate-none">
      <div class="rounded-xl border border-gray-200/90 bg-white/90 backdrop-blur-xl shadow-lg shadow-gray-900/8 p-4 sm:p-5 ring-1 ring-white/60 dark:border-chat-line/70 dark:bg-chat-raised/95 dark:shadow-[0_12px_48px_-16px_rgba(0,0,0,0.55)] dark:ring-chat-line/20">
        <div class="mb-4 text-center">
          <div class="flex items-center justify-center gap-2 mb-2">
            <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-mak-green/12 text-mak-green ring-1 ring-mak-green/20 dark:bg-mak-green/[0.12] dark:ring-mak-green/35">
              <i data-feather="shield" width="16" height="16" stroke-width="2"></i>
            </div>
            <img src="/assets/mak_logo.png" alt="Makerere University" class="h-7 w-auto opacity-95 dark:opacity-90">
          </div>
          <a href="/" class="text-base sm:text-lg font-bold tracking-tight text-mak-dark dark:text-white inline-block leading-snug">Ask<span class="text-mak-green">Mak</span></a>
          <p class="mt-1 text-[1.0625rem] sm:text-lg font-semibold tracking-tight text-gray-700 dark:text-zinc-100">Sign In</p>
        </div>

        <div id="alert" class="hidden"></div>

        <form id="login-form" class="space-y-2.5">
          <div class="mx-auto w-full max-w-[14.25rem] sm:max-w-[14.75rem] space-y-2.5">
          <div class="space-y-1">
            <label for="email" class="block text-[11px] font-medium text-gray-600 dark:text-zinc-400">Email</label>
            <div class="relative group">
              <span class="pointer-events-none absolute left-2.5 top-1/2 z-[1] -translate-y-1/2 text-gray-400 group-focus-within:text-mak-green dark:text-zinc-500 dark:group-focus-within:text-mak-green transition-colors">
                <i data-feather="mail" width="15" height="15"></i>
              </span>
              <input type="email" name="email" id="email" placeholder="you@example.com" required autocomplete="email"
                class="w-full pl-9 pr-2.5 py-2 rounded-lg text-[13px] leading-snug bg-white/95 text-gray-900 placeholder-gray-400 border border-gray-200 shadow-sm shadow-gray-900/[0.03] focus:outline-none focus:border-mak-green focus:ring-[3px] focus:ring-mak-green/15 transition dark:bg-chat-sidebar/85 dark:border-chat-line dark:text-zinc-100 dark:placeholder-zinc-500 dark:shadow-none dark:focus:border-mak-green/70 dark:focus:ring-mak-green/25">
            </div>
          </div>

          <div class="space-y-1">
            <label for="password" class="block text-[11px] font-medium text-gray-600 dark:text-zinc-400">Password</label>
            <div class="relative group">
              <span class="pointer-events-none absolute left-2.5 top-1/2 z-[1] -translate-y-1/2 text-gray-400 group-focus-within:text-mak-green dark:text-zinc-500 dark:group-focus-within:text-mak-green transition-colors">
                <i data-feather="lock" width="15" height="15"></i>
              </span>
              <input type="password" name="password" id="password" placeholder="Password" required autocomplete="current-password"
                class="w-full pl-9 pr-10 py-2 rounded-lg text-[13px] leading-snug bg-white/95 text-gray-900 placeholder-gray-400 border border-gray-200 shadow-sm shadow-gray-900/[0.03] focus:outline-none focus:border-mak-green focus:ring-[3px] focus:ring-mak-green/15 transition dark:bg-chat-sidebar/85 dark:border-chat-line dark:text-zinc-100 dark:placeholder-zinc-500 dark:shadow-none dark:focus:border-mak-green/70 dark:focus:ring-mak-green/25">
              <button type="button" class="toggle-password absolute right-1 top-1/2 z-[1] -translate-y-1/2 inline-flex h-7 w-7 items-center justify-center rounded-md text-gray-400 hover:text-mak-dark hover:bg-gray-100 dark:text-zinc-500 dark:hover:text-white dark:hover:bg-white/[0.06] transition cursor-pointer bg-transparent border-none" title="Show password" aria-label="Show password">
                <i data-feather="eye" width="15" height="15"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="mt-0.5 w-full inline-flex items-center justify-center gap-1.5 bg-mak-green text-white py-2.5 rounded-lg text-[1.0625rem] font-bold shadow-md shadow-mak-green/18 hover:shadow-mak-green/26 hover:brightness-[1.02] active:scale-[0.99] transition cursor-pointer dark:shadow-[0_0_20px_-4px_rgba(0,107,60,0.35)]">
            Sign In
          </button>
          </div>
        </form>

        <p class="mt-3 text-center text-[10px] leading-snug text-gray-500 dark:text-zinc-500">
          Wrong account? <button type="button" id="login-sign-out-first" class="font-medium text-mak-green hover:underline bg-transparent border-none cursor-pointer p-0">Sign out</button> first.
        </p>

        <p class="mt-3 pt-2.5 border-t border-gray-200/90 dark:border-chat-line/60 text-[11px] text-gray-500 dark:text-zinc-500 text-center">
          New here? <a href="/signup.html" class="font-semibold text-mak-green hover:text-[#008a45] dark:hover:text-emerald-400 transition underline-offset-2 hover:underline">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js"></script>
  <script>
    Auth.setupForms();
    if (typeof feather !== 'undefined') feather.replace();

    (function redirectIfAlreadySignedIn() {
      fetch('/api/auth/me', { credentials: 'include' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(body) {
          if (!body || !body.user) return;
          var params = new URLSearchParams(window.location.search);
          var next = params.get('next');
          var safeNext = next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : null;
          Auth.redirectAuthenticated(body.user, safeNext);
        })
        .catch(function() {});
    })();

    var signOutFirst = document.getElementById('login-sign-out-first');
    if (signOutFirst) {
      signOutFirst.addEventListener('click', function() {
        Auth.logout();
      });
    }
  </script>
</body>
</html>
