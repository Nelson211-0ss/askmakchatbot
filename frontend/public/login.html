<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In - AskMak</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#00a651">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="relative font-sans bg-transparent text-gray-900 dark:text-gray-100 min-h-dvh flex flex-col pb-[env(safe-area-inset-bottom,0px)]">

  <div class="home-chatbot-bg" aria-hidden="true">
    <div class="home-chatbot-bg__mesh"></div>
    <div class="home-chatbot-bg__grid"></div>
    <div class="home-chatbot-bg__orb home-chatbot-bg__orb--1"></div>
    <div class="home-chatbot-bg__orb home-chatbot-bg__orb--2"></div>
  </div>

  <header class="relative z-10 shrink-0 pt-[max(0px,env(safe-area-inset-top,0px))]">
    <div class="max-w-md mx-auto w-full pl-[max(1rem,env(safe-area-inset-left,0px))] pr-[max(1rem,env(safe-area-inset-right,0px))] sm:px-5 pt-5 sm:pt-6 flex items-center justify-between gap-3">
      <a href="/" class="group inline-flex items-center gap-2 rounded-lg pl-1.5 pr-2.5 py-2 text-sm font-medium text-gray-600 hover:text-mak-dark dark:text-gray-400 dark:hover:text-white transition">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-white/90 text-gray-500 shadow-sm ring-1 ring-gray-200/80 group-hover:text-mak-green group-hover:ring-mak-green/30 dark:bg-gray-900/80 dark:text-gray-400 dark:ring-gray-700 dark:group-hover:text-mak-green transition">
          <i data-feather="arrow-left" width="18" height="18"></i>
        </span>
        <span>Home</span>
      </a>
      <span class="hidden sm:inline text-xs text-gray-400 dark:text-gray-500 font-medium tracking-wide uppercase">Secure sign in</span>
    </div>
  </header>

  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 pb-10 sm:pb-12">
    <div class="w-full max-w-md animate-fade-in motion-reduce:animate-none">
      <div class="rounded-2xl border border-gray-200/90 dark:border-gray-600/70 bg-white/90 dark:bg-gray-900/85 backdrop-blur-xl shadow-xl shadow-gray-900/10 dark:shadow-black/50 p-7 sm:p-9 ring-1 ring-white/60 dark:ring-white/[0.06]">
        <div class="mb-8 text-center">
          <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-mak-green/12 text-mak-green ring-1 ring-mak-green/20 dark:bg-mak-green/15 dark:ring-mak-green/25">
            <i data-feather="shield" width="28" height="28" stroke-width="1.75"></i>
          </div>
          <img src="/assets/mak_logo.png" alt="Makerere University" class="h-12 w-auto mx-auto mb-4 opacity-95 dark:opacity-90">
          <a href="/" class="text-2xl sm:text-[1.65rem] font-bold tracking-tight text-mak-dark dark:text-white inline-block mb-1.5">Ask<span class="text-mak-green">Mak</span></a>
          <p class="text-sm text-gray-500 dark:text-gray-400 flex items-center justify-center gap-2">
            <i data-feather="key" width="16" height="16" class="shrink-0 opacity-70"></i>
            <span>Sign in to your account</span>
          </p>
        </div>

        <div id="alert" class="hidden"></div>

        <form id="login-form" class="space-y-5">
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Email</label>
            <div class="relative group">
              <span class="pointer-events-none absolute left-3.5 top-1/2 z-[1] -translate-y-1/2 text-gray-400 group-focus-within:text-mak-green/90 transition-colors">
                <i data-feather="mail" width="18" height="18"></i>
              </span>
              <input type="email" name="email" id="email" placeholder="you@example.com" required autocomplete="email"
                class="w-full pl-11 pr-3.5 py-3 rounded-xl text-sm bg-white/95 dark:bg-gray-950/50 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 border border-gray-200 dark:border-gray-600/90 shadow-sm shadow-gray-900/[0.03] focus:outline-none focus:border-mak-green focus:ring-4 focus:ring-mak-green/10 dark:focus:ring-mak-green/15 transition">
            </div>
          </div>

          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
            <div class="relative group">
              <span class="pointer-events-none absolute left-3.5 top-1/2 z-[1] -translate-y-1/2 text-gray-400 group-focus-within:text-mak-green/90 transition-colors">
                <i data-feather="lock" width="18" height="18"></i>
              </span>
              <input type="password" name="password" id="password" placeholder="Enter password" required autocomplete="current-password"
                class="w-full pl-11 pr-12 py-3 rounded-xl text-sm bg-white/95 dark:bg-gray-950/50 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 border border-gray-200 dark:border-gray-600/90 shadow-sm shadow-gray-900/[0.03] focus:outline-none focus:border-mak-green focus:ring-4 focus:ring-mak-green/10 dark:focus:ring-mak-green/15 transition">
              <button type="button" class="toggle-password absolute right-2 top-1/2 z-[1] -translate-y-1/2 inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 hover:text-mak-dark hover:bg-gray-100 dark:hover:text-white dark:hover:bg-gray-800/80 transition cursor-pointer bg-transparent border-none" title="Show password" aria-label="Show password">
                <i data-feather="eye" width="18" height="18"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="mt-2 w-full inline-flex items-center justify-center gap-2.5 bg-mak-green text-white py-3 rounded-xl text-sm font-semibold shadow-lg shadow-mak-green/25 hover:shadow-mak-green/35 hover:brightness-[1.03] active:scale-[0.99] transition cursor-pointer">
            <i data-feather="log-in" width="18" height="18"></i>
            Sign in
          </button>
        </form>

        <p class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400">
          Wrong account? <button type="button" id="login-sign-out-first" class="font-medium text-mak-green hover:underline bg-transparent border-none cursor-pointer p-0">Sign out</button> first.
        </p>

        <p class="mt-8 pt-6 border-t border-gray-200/90 dark:border-gray-700/80 text-sm text-gray-500 dark:text-gray-400 text-center flex flex-wrap items-center justify-center gap-x-1.5 gap-y-1">
          <span class="inline-flex items-center gap-1.5">
            <i data-feather="user-plus" width="16" height="16" class="text-mak-green/80 shrink-0"></i>
            <span>New here?</span>
          </span>
          <a href="/signup.html" class="font-semibold text-mak-green hover:text-[#008a45] dark:hover:text-emerald-400 transition underline-offset-2 hover:underline">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js"></script>
  <script>
    Auth.setupForms();
    if (typeof feather !== 'undefined') feather.replace();

    (function redirectIfAlreadySignedIn() {
      fetch('/api/auth/me', { credentials: 'include' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(body) {
          if (!body || !body.user) return;
          var params = new URLSearchParams(window.location.search);
          var next = params.get('next');
          var safeNext = next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : null;
          Auth.redirectAuthenticated(body.user, safeNext);
        })
        .catch(function() {});
    })();

    var signOutFirst = document.getElementById('login-sign-out-first');
    if (signOutFirst) {
      signOutFirst.addEventListener('click', function() {
        Auth.logout();
      });
    }
  </script>
</body>
</html>
